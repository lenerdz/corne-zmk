CONFIG_ZMK_DISPLAY=y

# Tela de status personalizada do módulo zmk-nice-oled (widgets verticais).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Desliga o apagar de tela do próprio ZMK, que não distingue USB de bateria. Com isso as
# telas ficam sempre ligadas por padrão (nem no USB nem na bateria). Quem apaga a tela,
# só se você mandar, é o módulo zmk-rgb-matrix (opção abaixo; o modo "Never" não apaga nunca).
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Configurações das telas (contraste de cada tela, quando apagar e o aviso das luzes),
# editáveis sem recompilar na aba Display do ZMK Studio (fork do app). Cada metade guarda
# os valores na própria memória. Precisa estar ligada nas duas metades (por isso fica
# aqui) e exige a linha acima (BLANK_ON_IDLE=n). Para tirar o recurso, apague esta linha:
# as telas ficam sempre ligadas e a aba Display some do app.
CONFIG_KEYPAW_DISPLAY_SETTINGS=y

# Layout das telas: quais widgets do zmk-nice-oled cada tela desenha e onde, e qual
# animação ou imagem a tela direita mostra, editáveis sem recompilar na aba OLED do ZMK
# Studio (fork do app). São configurações de tela como as de cima (ids de 16 em diante):
# cada metade guarda os valores na própria memória e a esquerda copia os da tela direita
# para a direita. Precisa estar ligada nas duas metades (por isso fica aqui) e exige o
# fork do zmk-nice-oled que lê o layout e a linha acima (CONFIG_KEYPAW_DISPLAY_SETTINGS=y).
# Sem ela os widgets ficam onde as opções CONFIG_NICE_OLED_* mandam, só a animação
# escolhida entra no firmware da direita e a aba OLED some do app (a aba Display
# continua). Custo medido no CI: a metade direita cresce 68.520 bytes de flash (todas as
# animações entram no firmware) e 560 bytes de RAM; a esquerda, 1.432 bytes de flash e
# 224 de RAM.
CONFIG_KEYPAW_OLED_LAYOUT=y

# Animação da tela direita (zmk-nice-oled): o gato, o padrão do módulo. Estas opções ficam
# aqui, e não em corne_right.conf, porque com o layout ligado a metade esquerda lista as
# configurações da tela direita e calcula os padrões delas (a animação inicial e a
# posição) a partir destas opções: as duas metades precisam ter os mesmos valores. Com o
# layout ligado todas as animações e imagens estão no firmware da direita e a aba OLED
# troca entre elas sem recompilar; a escolha daqui é só a que a tela mostra ao ligar. Para
# mudar a inicial, desligue o gato e ligue UMA das outras:
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# A animação gasta bateria (a tela da direita fica sempre acesa por padrão, e a metade só
# tem a bateria dela; o modo de apagar é uma configuração do ZMK Studio). Para gastar
# menos, troque a animação por uma imagem parada:
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
#   CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
# e escolha a imagem com CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y ou
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIP_MARCOS=y.

# Evita conflito de link com widgets built-in do ZMK
CONFIG_ZMK_WIDGET_LAYER_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=n
CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

# O LVGL 9 precisa de mais pilha na thread do display: com o valor antigo
# (2560) a metade periférica dava hard fault. 4096 já é o padrão do módulo;
# fica explícito aqui para não depender disso.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

CONFIG_ZMK_BLE=y

CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

CONFIG_ZMK_SLEEP=n

# O RGB agora é do módulo zmk-rgb-matrix (nós keypaw,* em corne.keymap e nos
# overlays de cada metade). O underglow nativo (CONFIG_ZMK_RGB_UNDERGLOW) fica
# desligado: os dois não podem controlar a mesma fita ao mesmo tempo.
# Padrão do módulo: os LEDs apagam quando o teclado fica ocioso. Para mantê-los
# acesos (com o brilho "idle-brightness" do &kprgb), use:
# CONFIG_KEYPAW_RGB_MATRIX_AUTO_OFF_IDLE=n

# NKRO: qualquer número de teclas ao mesmo tempo. A camada STENO depende dele:
# o acorde que liga o Plover tem 7 teclas (veja o macro steno_on em corne.keymap).
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Os widgets de cada tela (zmk-nice-oled) são configurados por metade, porque cada
# tela mostra coisas diferentes (e os widgets de WPM, bateria das duas metades etc.
# só existem na central):
#   corne_left.conf   tela esquerda (central)
#   corne_right.conf  tela direita (periférica)
# A animação da tela direita fica neste arquivo (veja acima): com o layout das telas
# ligado, a esquerda precisa das mesmas opções dela.
