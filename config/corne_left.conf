# Opções só da metade esquerda (a central, que executa o ZMK Studio e comanda a
# tela esquerda). O corne.conf vale para as duas metades; este arquivo vale só
# para a esquerda.

# --- ZMK Studio ---

# Buffer de recepção do ZMK Studio. O padrão do ZMK (30 bytes) descarta os bytes
# que não cabem ("Dropping incoming RPC byte, insufficient room in the RX buffer").
# Um pedido que edita 16 cores de LED (a aba Lights do fork do app) tem 158 bytes
# depois do enquadramento, até cerca de 210 com escapes. Sem este valor o pedido
# chega cortado e a edição se perde. O módulo zmk-rgb-matrix confere: a compilação
# falha com um valor menor que 256.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256

# --- Tela esquerda (zmk-nice-oled, central) ---
# A tela mostra a saída ativa (USB ou Bluetooth), a bateria, o perfil Bluetooth, a
# velocidade de digitação (WPM) e o nome da camada ativa.

# Velocidade de digitação: sem o gato, com velocímetro, número e gráfico.
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Sem indicadores de modificadores (Ctrl, Shift, Alt, Gui).
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# Bateria das duas metades na tela esquerda: no lugar do ícone de bateria aparece o
# texto "esquerda  direita" (por exemplo "85  90"), sem o indicador de carga por USB.
# A central precisa buscar o nível de bateria da periférica por Bluetooth. Para
# voltar ao ícone da bateria só da esquerda, apague as duas linhas abaixo.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_NICE_OLED_WIDGET_CENTRAL_SHOW_BATTERY_PERIPHERAL_AND_CENTRAL=y

# --- Estenotipia GeminiPR (camada GEMINI) ---

# O teclado passa a ter duas portas seriais USB (ZMK Studio e GeminiPR). Cada porta
# usa ate 2 transferencias USB ao mesmo tempo (uma de leitura, uma de escrita), ou
# seja, 4 com as duas portas: exatamente o padrao (4), sem folga. Com 8 sobra margem.
CONFIG_USB_MAX_NUM_TRANSFERS=8
