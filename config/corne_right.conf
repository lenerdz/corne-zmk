# Opções só da metade direita (a periférica, que fala com o computador por meio
# da esquerda). O corne.conf vale para as duas metades; este arquivo vale só para
# a direita.

# --- Tela direita (zmk-nice-oled, periférica) ---
# A tela mostra uma animação, a bateria e o estado da conexão Bluetooth com a metade
# esquerda. O WPM e o nome da camada só existem na tela da central (a esquerda).

# Animação: o gato (o padrão do módulo). Para trocar, desligue o gato e ligue UMA
# das outras:
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# A animação gasta bateria (a tela da direita fica sempre acesa por padrão, e a metade só
# tem a bateria dela; o modo de apagar é uma configuração do ZMK Studio). Para gastar
# menos, troque a animação por uma imagem parada:
#   CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
#   CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y
# e escolha a imagem com CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y ou
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIP_MARCOS=y.

# O WPM na periférica exige um módulo extra (zmk-wpm-peripheral).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=n

# --- Aviso das luzes (toast) ---
# Por um instante depois de uma mudança nas luzes (efeito, brilho, matiz, saturação,
# ciclo, ligar/apagar, reset), a tela mostra duas linhas embaixo do gato: por exemplo
# "EFEITO 4" e "RAINBOW". Vale para as teclas de luz das duas metades. Precisa do
# evento do módulo zmk-rgb-matrix (CONFIG_KEYPAW_RGB_MATRIX_CHANGE_EVENT, ligado por
# padrão). Para tirar o aviso do build, apague as três linhas abaixo.
# Com CONFIG_KEYPAW_DISPLAY_SETTINGS=y (corne.conf), ligar ou desligar o aviso e o tempo
# dele são configurações do ZMK Studio (aba Display): o valor de
# CONFIG_NICE_OLED_WIDGET_LED_TOAST_MS abaixo só vale se essa opção for desligada, e o
# tempo padrão passa a ser CONFIG_KEYPAW_DISPLAY_TOAST_MS_DEFAULT (1500).
CONFIG_NICE_OLED_WIDGET_LED_TOAST=y
CONFIG_NICE_OLED_WIDGET_LED_TOAST_LANGUAGE_PT_BR=y
CONFIG_NICE_OLED_WIDGET_LED_TOAST_MS=1500
