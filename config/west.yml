      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    - name: zmk-rgb-matrix
      remote: gudzpoz
      # Commit de 2026-10-08: "test: more tests in preparation for selector overlay"
      revision: a9add033e85fb0f2982a43ad93adf80b7d97fa06
