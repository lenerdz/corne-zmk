manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Forks mantidos em https://github.com/lenerdz dos modulos zmk-rgb-matrix e zmk-nice-oled.
    - name: lenerdz
      url-base: https://github.com/lenerdz
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      # ZMK main (Zephyr 4.1) fixado em um commit para builds reproduziveis.
      # Commit de 2026-10-09: "trivial: Use USB IF instead of BT SIG namespace (#3505)"
      # Se trocar, troque tambem o ref em .github/workflows/build.yml.
      revision: 4dd95d7840eb3d5a3f59bb29fbf1ab054715ef85
      import: app/west.yml
    - name: zmk-rgb-matrix
      remote: lenerdz
      # RGB por tecla (posicao-aware) com efeitos, overlays e sync entre as metades.
      # Branch corne-fixes do fork (commit 7b72be8) = upstream gudzpoz/zmk-rgb-matrix a9add03
      # (2026-10-08) + fix/behavior-metadata-sets-type (compilar com o ZMK Studio ligado)
      # + fix/physical-layout-lookup (usar o layout fisico certo; sem isso as teclas do
      # polegar nao reagem nos efeitos por posicao).
      # Voltar para o upstream (remote gudzpoz) quando o autor corrigir os dois.
      revision: 7b72be809777d87d25848194063ff25f04f0f04e
    - name: zmk-nice-oled
      remote: lenerdz
      # Widgets verticais para a tela OLED. Branch zmk-main do fork (commit 479a516) =
      # PR #37 de mctechnology17/zmk-nice-oled (migracao para ZMK main / Zephyr 4.1 / LVGL 9,
      # de tokyo2006, commit de5b2af) + tratamento do transporte ZMK_TRANSPORT_NONE (sem isso o
      # icone de saida fica em branco enquanto o teclado esta desconectado).
      # Voltar para o upstream (remote mctechnology17, revision main) quando o PR for aceito.
      revision: 479a516e01c942df79567475e424de4d1560e28c
  self:
    path: config
